name: Bytherix EAM — CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================================
  # 1. Backend Automated Test Suite (FastAPI + Pytest)
  # ============================================================================
  backend-tests:
    name: Backend Test Suite (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest Suite
        env:
          APP_ENV: test
          SECRET_KEY: bytherix_ci_super_secret_key_32_bytes_long
          DATABASE_URL: sqlite:///:memory:
        run: |
          pytest -v

  # ============================================================================
  # 2. Frontend Production Build & TypeScript Verification (Next.js 14)
  # ============================================================================
  frontend-build:
    name: Frontend Build & Typecheck (Next.js 14)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Next.js Production Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: npm run build

  # ============================================================================
  # 3. Docker Compose & Staging Orchestration Linting
  # ============================================================================
  docker-validation:
    name: Staging Docker Compose Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
