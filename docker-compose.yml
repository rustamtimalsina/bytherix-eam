version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 with pgvector Extension (Vector RAG Database)
  # ----------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: bytherix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bytherix_eam
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bytherix_eam"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bytherix_net

  # ----------------------------------------------------------------------------
  # 2. Redis 7 (Rate Limiting, DLP Cache, & Celery Message Broker)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: bytherix_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bytherix_net

  # ----------------------------------------------------------------------------
  # 3. MinIO (S3-Compatible Secure Document Object Storage)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: bytherix_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - bytherix_net

  # ----------------------------------------------------------------------------
  # 4. FastAPI Backend (Python 3.12 Engine)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bytherix_backend
    restart: unless-stopped
    environment:
      APP_ENV: staging
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@db:5432/bytherix_eam
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadminpassword
      S3_BUCKET_NAME: bytherix-documents
      SECRET_KEY: bytherix_staging_secret_key_32_bytes_super_secure
      FRONTEND_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - bytherix_net

  # ----------------------------------------------------------------------------
  # 5. Next.js 14 Frontend Web Application
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bytherix_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - bytherix_net

  # ----------------------------------------------------------------------------
  # 6. Nginx Ingress Reverse Proxy & Load Balancer
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: bytherix_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - bytherix_net

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  bytherix_net:
    driver: bridge
