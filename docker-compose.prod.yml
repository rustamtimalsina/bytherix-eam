version: "3.8"

# ==============================================================================
# Bytherix EAM — Production Multi-Container Docker Stack
# Architecture: High-Availability, Isolated VPC Network, TLS Termination
# Services: PostgreSQL 16 (pgvector), Redis 7, MinIO, FastAPI (Gunicorn),
#           Celery Worker, Next.js Standalone, Nginx SSL Ingress, Certbot Auto-Renew
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 with pgvector Extension
  # ----------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: bytherix_prod_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bytherix_eam_prod}
      POSTGRES_USER: ${POSTGRES_USER:-bytherix_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be provided}
    command: >
      postgres
      -c shared_buffers=1GB
      -c work_mem=64MB
      -c maintenance_work_mem=256MB
      -c effective_cache_size=3GB
      -c max_connections=200
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
    volumes:
      - prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bytherix_admin} -d ${POSTGRES_DB:-bytherix_eam_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - bytherix_backend_net
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M

  # ----------------------------------------------------------------------------
  # 2. Redis 7 (Rate Limiting, DLP Cache, & Celery Broker)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: bytherix_prod_redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Redis password must be provided}
      --appendonly yes
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
    volumes:
      - prod_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bytherix_backend_net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  # ----------------------------------------------------------------------------
  # 3. Database Migration Runner (Alembic)
  # ----------------------------------------------------------------------------
  migration:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bytherix_prod_migration
    restart: "no"
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bytherix_admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bytherix_eam_prod}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bytherix_backend_net

  # ----------------------------------------------------------------------------
  # 4. FastAPI Production Backend (Multi-Worker Gunicorn)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bytherix_prod_backend
    restart: always
    command: >
      gunicorn app.main:app
      --workers 4
      --worker-class uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --timeout 300
      --keep-alive 65
      --access-logfile -
      --error-logfile -
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bytherix_admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bytherix_eam_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3 access key required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3 secret key required}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-bytherix-enterprise-documents}
      SECRET_KEY: ${SECRET_KEY:?Application SECRET_KEY required}
      FRONTEND_URL: https://app.bytherix.com
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - bytherix_backend_net
      - bytherix_ingress_net
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M

  # ----------------------------------------------------------------------------
  # 5. Celery Asynchronous Task Worker
  # ----------------------------------------------------------------------------
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bytherix_prod_celery
    restart: always
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4 -E
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bytherix_admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bytherix_eam_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-bytherix-enterprise-documents}
      SECRET_KEY: ${SECRET_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bytherix_backend_net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  # ----------------------------------------------------------------------------
  # 6. Next.js 14 Frontend Web Application (Standalone Node.js Server)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bytherix_prod_frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://app.bytherix.com/api/v1
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - bytherix_ingress_net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  # ----------------------------------------------------------------------------
  # 7. Production Nginx TLS/SSL Ingress
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: bytherix_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - bytherix_ingress_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  # ----------------------------------------------------------------------------
  # 8. Automated Let's Encrypt SSL Certificate Renewer
  # ----------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: bytherix_prod_certbot
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - bytherix_ingress_net

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  prod_pgdata:
  prod_redisdata:
  certbot_certs:
  certbot_www:

# ------------------------------------------------------------------------------
# Isolated Network Topologies
# ------------------------------------------------------------------------------
networks:
  bytherix_backend_net:
    driver: bridge
    internal: true
  bytherix_ingress_net:
    driver: bridge
