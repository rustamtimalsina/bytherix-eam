# Local development database only. Run the API itself with uvicorn (see README).
services:
  db:
    image: postgres:16
    container_name: bytherix-db
    environment:
      POSTGRES_USER: bytherix
      POSTGRES_PASSWORD: bytherix_dev_password
      POSTGRES_DB: bytherix
    ports:
      - "5432:5432"
    volumes:
      - bytherix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bytherix -d bytherix"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bytherix_pgdata:
