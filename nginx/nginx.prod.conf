# ==============================================================================
# Bytherix EAM — Production Nginx Ingress Configuration
# Target Domain: app.bytherix.com & api.bytherix.com
# Security: TLS 1.2/1.3, Strict-Transport-Security, SSE Streaming Optimization
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format with request ID, latency, and TLS ciphers
    log_format production_json escape=json
      '{"time_local":"$time_iso8601",'
      '"client_ip":"$remote_addr",'
      '"remote_user":"$remote_user",'
      '"request":"$request",'
      '"status": "$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"request_time":"$request_time",'
      '"upstream_response_time":"$upstream_response_time",'
      '"http_referrer":"$http_referer",'
      '"http_user_agent":"$http_user_agent",'
      '"http_x_request_id":"$http_x_request_id",'
      '"ssl_protocol":"$ssl_protocol",'
      '"ssl_cipher":"$ssl_cipher"}';

    access_log /var/log/nginx/access_json.log production_json;
    error_log  /var/log/nginx/error.log warn;

    # Performance Tuning
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens   off;

    # Payload limits (enterprise PDF uploads up to 50MB)
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Compression (Gzip + Brotli compatible)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Nginx Edge Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;
    limit_conn_zone $binary_remote_addr zone=addr_conn:10m;

    # Upstream Clusters
    upstream backend_cluster {
        server backend:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream frontend_cluster {
        server frontend:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # 1. HTTP to HTTPS Redirection (Port 80)
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name app.bytherix.com api.bytherix.com localhost;

        # Let's Encrypt ACME Challenge Path
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Health check endpoint allowed over HTTP for internal VPC probes
        location /health {
            proxy_pass http://backend_cluster/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # 2. Production HTTPS Server (Port 443)
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name app.bytherix.com api.bytherix.com;

        # SSL Certificates (Mounted from Let's Encrypt or Cloud PKI)
        ssl_certificate     /etc/letsencrypt/live/bytherix.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bytherix.com/privkey.pem;

        # SSL Protocol & Modern Cipher Hardening (Mozilla Intermediate standard)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:20m;
        ssl_session_tickets off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # Enterprise Security Headers (HSTS, Anti-Clickjacking, MIME Sniffing)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Active connection limit per IP
        limit_conn addr_conn 50;

        # ----------------------------------------------------------------------
        # Backend API Ingress (/api/)
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;

            # Forwarded headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Request-ID $http_x_request_id;

            # Upstream timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # ----------------------------------------------------------------------
        # High-Priority SSE Streaming Optimization (Chat & Model Arena)
        # ----------------------------------------------------------------------
        location ~* ^/api/v1/(chat|models/.*/predict|models/arena) {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;

            # Disable all proxy buffering for sub-millisecond SSE token delivery
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # Keep TCP connection alive during long streaming generations
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 10s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        # ----------------------------------------------------------------------
        # Authentication Rate Limiting (/api/v1/auth)
        # ----------------------------------------------------------------------
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ----------------------------------------------------------------------
        # Health & Telemetry Probes
        # ----------------------------------------------------------------------
        location ~* ^/health(/.*)?$ {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            access_log off;
        }

        # ----------------------------------------------------------------------
        # Next.js Static Asset Caching (/_next/static/)
        # ----------------------------------------------------------------------
        location /_next/static/ {
            proxy_pass http://frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            # Static chunks have content hashes, safe for 1-year immutable caching
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # ----------------------------------------------------------------------
        # Next.js Frontend Application Ingress (Root)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://frontend_cluster;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }
    }
}
